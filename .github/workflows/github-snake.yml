name: GitHub Contribution Snake

on:
  workflow_dispatch:
  schedule:
    - cron: "37 2 * * *"
  push:
    paths:
      - ".github/workflows/github-snake.yml"

permissions:
  contents: write

jobs:
  snake:
    runs-on: ubuntu-latest
    steps:
      - name: Generate contribution snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?palette=github-dark

      - name: Publish generated asset
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git clone --depth 1 "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" publish
          mkdir -p publish/assets
          cp dist/github-snake.svg publish/assets/github-snake.svg
          cd publish
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/github-snake.svg
          git diff --cached --quiet && exit 0
          git commit -m "chore: refresh contribution snake"
          git push origin main
