name: Generate Profile Analytics

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * *"
  push:
    paths:
      - ".github/workflows/profile-stats.yml"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate static GitHub profile cards
        uses: shinpr/github-profile-stats@49b5f7091182a45f3ef93923505b660c6da5f835
        with:
          username: ${{ github.repository_owner }}

      - name: Commit generated cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/
          git diff --cached --quiet && exit 0
          git commit -m "chore: refresh profile analytics"
          git push
