name: Profile Summary Cards

on:
  workflow_dispatch:
  schedule:
    - cron: "17 2 * * *"
  push:
    paths:
      - ".github/workflows/profile-summary-cards.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Generate profile cards
        uses: vn7n24fzkq/github-profile-summary-cards@release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          USERNAME: ${{ github.repository_owner }}
          BRANCH_NAME: "main"
          UTC_OFFSET: 5.5
          THEME: "github_dark"
          ANIMATION: "sequence"
          DURATION: "3.5"
          AUTO_PUSH: true
